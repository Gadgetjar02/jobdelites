<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employer Registration – JobDelite</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b4b;
      --blue: #1a56ff;
      --blue-light: #3b82f6;
      --blue-pale: #eff4ff;
      --gray: #6b7280;
      --light: #f9fafb;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(26,86,255,0.10);
      --radius: 12px;
      --danger: #ef4444;
    }
    body { font-family: 'DM Sans', sans-serif; color: var(--navy); background: var(--light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 5vw; background: var(--white); box-shadow: 0 1px 0 #e5e7eb;
      position: sticky; top: 0; z-index: 200;
    }
    .logo img { height: 40px; width: auto; }
    .back-home { text-decoration: none; font-size: 0.88rem; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 4px; }

    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5vw; }
    .auth-card { background: var(--white); width: 100%; max-width: 620px; padding: 36px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e5e7eb; }
    
    .form-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; text-align: center; letter-spacing: -0.3px; }
    .form-subtitle { font-size: 0.88rem; color: var(--gray); text-align: center; margin-bottom: 24px; line-height: 1.4; }

    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group.row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--navy); }
    .form-group input, .form-group textarea { padding: 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 0.9rem; color: var(--navy); outline: none; width: 100%; -webkit-appearance: none; }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26, 86, 255, 0.1); }
    
    .section-header { margin: 32px 0 16px 0; padding-top: 16px; border-top: 2px dashed var(--blue-pale); font-size: 1.05rem; font-weight: 700; color: var(--navy); display: flex; flex-direction: column; gap: 2px; }
    .section-header span { font-size: 0.78rem; color: var(--gray); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

    .file-input-wrapper { border: 1.5px dashed #d1d5db; padding: 22px; border-radius: 8px; text-align: center; background: var(--light); cursor: pointer; font-size: 0.85rem; color: var(--gray); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .file-input-wrapper:hover { border-color: var(--blue); background: var(--blue-pale); color: var(--blue); }

    .logo-preview-box { display: none; align-items: center; gap: 14px; background: var(--blue-pale); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px dashed rgba(26,86,255,0.3); }
    .logo-preview-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--white); background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .logo-preview-info { font-size: 0.82rem; font-weight: 600; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .file-remove-btn { background: none; border: none; color: var(--gray); cursor: pointer; font-weight: bold; font-size: 1rem; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; }
    .file-remove-btn:hover { background: #fee2e2; color: var(--danger); }

    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--blue); font-size: 0.95rem; font-weight: 700; color: var(--white); cursor: pointer; margin-top: 24px; font-family: inherit; }
    .btn-submit:hover { background: #1240d6; }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      nav { padding: 12px 4vw; }
      .logo img { height: 34px; }
      .auth-container { padding: 16px 3vw; }
      .auth-card { padding: 24px 16px; border-radius: 10px; }
      .form-title { font-size: 1.25rem; }
      .form-subtitle { font-size: 0.82rem; margin-bottom: 20px; }
      .form-group.row-split { grid-template-columns: 1fr; gap: 14px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo"><img src="img/logoreal.png" alt="JobDelite Logo"/></a>
  <a href="index.html" class="back-home">← <span>Back to Home</span></a>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <h2 class="form-title">Create Corporate Employer Profile</h2>
    <p class="form-subtitle">Get started searching jobs or hiring top talent today.</p>

    <form id="employerForm" action="dashboard.html" method="GET">
      <input type="hidden" name="role" value="employer">
      
      <!-- Primary Profile Identity -->
      <div class="form-group">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" placeholder="e.g. Delite City Solutions" required>
      </div>

      <div class="form-group row-split">
        <div>
          <label for="phone">Company Contact Number</label>
          <input type="tel" id="phone" placeholder="+234 (0) 800 000 0000" required>
        </div>
        <div>
          <label for="location">Headquarters / Location</label>
          <input type="text" id="location" placeholder="e.g. Lagos, Nigeria" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Work Email Address</label>
        <input type="email" id="email" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <!-- Business Validation Info Block -->
      <div class="section-header">
        Company Profile Details
        <span>Provide core information about your organization</span>
      </div>

      <div class="form-group">
        <label for="businessAddress">Business Address</label>
        <input type="text" id="businessAddress" placeholder="e.g. 123 Corporate Parkway, Suite 4B" required>
      </div>

      <div class="form-group">
        <label for="companyProfile">Company Profile Information</label>
        <textarea id="companyProfile" placeholder="Brief summary of your company's mission, values, industry focus, and ecosystem services..." required></textarea>
      </div>

      <!-- Runtime Image Verification Tier -->
      <div class="form-group" style="margin-top: 14px;">
        <label>Company Logo</label>
        <label class="file-input-wrapper" id="logoDropZone">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span id="logoInputLabel">Upload Corporate Logo (PNG, JPG)</span>
          <input type="file" id="companyLogoFile" style="display:none;" accept="image/png, image/jpeg, image/jpg">
        </label>
        
        <div class="logo-preview-box" id="logoPreviewWrapper">
          <img src="#" alt="Logo Preview" class="logo-preview-img" id="logoPreviewElement">
          <div class="logo-preview-info" id="logoPreviewFilename">logo.png</div>
          <button type="button" class="file-remove-btn" onclick="clearLogoImageFile()">×</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Complete Registration</button>
    </form>
  </div>
</div>

<script>
  const logoInput = document.getElementById('companyLogoFile');
  const logoDropZone = document.getElementById('logoDropZone');
  const logoPreviewWrapper = document.getElementById('logoPreviewWrapper');
  const logoPreviewElement = document.getElementById('logoPreviewElement');
  const logoPreviewFilename = document.getElementById('logoPreviewFilename');

  logoInput.addEventListener('change', function() {
    if (this.files && this.files[0]) {
      const targetFile = this.files[0];
      logoPreviewFilename.innerText = targetFile.name;
      
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        logoPreviewElement.src = e.target.result;
        logoDropZone.classList.add('hidden');
        logoPreviewWrapper.style.display = 'flex';
      }
      fileReader.readAsDataURL(targetFile);
    }
  });

  function clearLogoImageFile() {
    logoInput.value = '';
    logoPreviewElement.src = '#';
    logoPreviewWrapper.style.display = 'none';
    logoDropZone.classList.remove('hidden');
  }
</script>
</body>
</html>
