<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join JobDelite – Secure Access</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b4b;
      --blue: #1a56ff;
      --blue-light: #3b82f6;
      --blue-pale: #eff4ff;
      --gray: #6b7280;
      --light: #f9fafb;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(26,86,255,0.10);
      --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; color: var(--navy); background: var(--light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    /* Nav alignment matching main file layout safely */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 5vw; background: var(--white); box-shadow: 0 1px 0 #e5e7eb;
      position: sticky; top: 0; z-index: 200;
    }
    .logo img { height: 40px; width: auto; transition: height 0.2s; }
    .back-home { text-decoration: none; font-size: 0.88rem; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 4px; transition: color 0.2s; }
    .back-home:hover { color: #1240d6; }

    /* Auth Wrapper & Flexible View Layout */
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5vw; }
    .auth-card { background: var(--white); width: 100%; max-width: 460px; padding: 36px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e5e7eb; transition: padding 0.2s; }
    
    /* Toggle Tabs Header styling */
    .auth-tabs { display: flex; border-bottom: 2px solid var(--blue-pale); margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 12px; font-family: inherit; font-size: 0.95rem; font-weight: 600; background: none; border: none; color: var(--gray); cursor: pointer; text-align: center; transition: all 0.2s; position: relative; }
    .tab-btn.active { color: var(--blue); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: var(--blue); }

    /* Segmented Grid Control for System Roles */
    .role-selector { display: flex; background: var(--blue-pale); padding: 4px; border-radius: 8px; margin-bottom: 24px; }
    .role-btn { flex: 1; padding: 10px; font-family: inherit; font-size: 0.88rem; font-weight: 600; border: none; border-radius: 6px; background: transparent; color: var(--navy); cursor: pointer; transition: all 0.2s; text-align: center; white-space: nowrap; }
    .role-btn.active { background: var(--white); color: var(--blue); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .form-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; text-align: center; letter-spacing: -0.3px; }
    .form-subtitle { font-size: 0.88rem; color: var(--gray); text-align: center; margin-bottom: 24px; line-height: 1.4; }

    /* Inputs System Layout Structure */
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--navy); }
    .form-group input { padding: 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 0.9rem; color: var(--navy); outline: none; transition: border-color 0.2s; width: 100%; -webkit-appearance: none; }
    .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26, 86, 255, 0.1); }
    
    /* Drag-drop style File Input UI Component */
    .file-input-wrapper { border: 1.5px dashed #d1d5db; padding: 16px; border-radius: 8px; text-align: center; background: var(--light); cursor: pointer; font-size: 0.85rem; color: var(--gray); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s; }
    .file-input-wrapper:hover { border-color: var(--blue); background: var(--blue-pale); color: var(--blue); }
    .file-input-wrapper svg { color: inherit; }

    .btn-submit { width: 100%; padding: 13px; border: none; border-radius: 8px; background: var(--blue); font-size: 0.95rem; font-weight: 700; color: var(--white); cursor: pointer; transition: background 0.2s; margin-top: 10px; font-family: inherit; }
    .btn-submit:hover { background: #1240d6; }

    /* Utilities hidden controller */
    .hidden { display: none !important; }

    /* ── RESPONSIVE CHANNELS & MEDIA QUERIES ── */
    
    /* Adjustments for typical small monitors and tablets */
    @media (max-width: 600px) {
      nav { padding: 12px 4vw; }
      .logo img { height: 34px; }
      
      .auth-container { padding: 20px 4vw; }
      .auth-card { padding: 24px 20px; border-radius: 10px; }
      
      .form-title { font-size: 1.25rem; }
      .form-subtitle { font-size: 0.82rem; margin-bottom: 20px; }
      
      .role-btn { font-size: 0.82rem; padding: 8px 4px; }
      .tab-btn { font-size: 0.9rem; padding: 10px; }
    }

    /* Target extremely narrow device displays */
    @media (max-width: 360px) {
      .role-selector { flex-direction: column; gap: 4px; background: transparent; padding: 0; }
      .role-btn { background: var(--blue-pale); border-radius: 6px; width: 100%; }
      .role-btn.active { background: var(--blue); color: var(--white); }
    }
  </style>
</head>
<body>

<!-- NAVIGATION HEADER -->
<nav>
  <a href="index.html" class="logo"><img src="img/logoreal.png" alt="JobDelite Logo"/></a>
  <a href="index.html" class="back-home">← <span>Back to Home</span></a>
</nav>

<!-- CORE AUTH CONTAINER WORKSPACE -->
<div class="auth-container">
  <div class="auth-card">
    
    <!-- Auth Screen Active Selector Mode Tabs -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="setAuthMode('login')">Sign In</button>
      <button class="tab-btn" id="tabRegister" onclick="setAuthMode('register')">Register</button>
    </div>

    <!-- Active User Profile Identity Role Switcher Segment -->
    <div class="role-selector">
      <button class="role-btn active" id="roleSeeker" onclick="setRole('seeker')">Job Seeker</button>
      <button class="role-btn" id="roleEmployer" onclick="setRole('employer')">Employer / Company</button>
    </div>

    <!-- Dynamic Titles Header Area -->
    <h2 class="form-title" id="formHeading">Welcome Back</h2>
    <p class="form-subtitle" id="formSubheading">Access your curated dashboard workspace.</p>

    <!-- Interactive Processing Form Pipeline -->
    <form id="authForm" action="dashboard.html" method="GET">
      <!-- Hidden query controller flag syncing roles down to dashboard environment -->
      <input type="hidden" name="role" id="roleInput" value="seeker">
      
      <!-- Registration Specific Module Field: Name -->
      <div class="form-group reg-only hidden">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe">
      </div>

      <!-- Registration Specific Module Field: Company Name -->
      <div class="form-group reg-only employer-only hidden">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" placeholder="e.g. Delite City Solutions">
      </div>

      <!-- Account Universal Identification Credentials -->
      <div class="form-group">
        <label for="email">Work Email Address</label>
        <input type="email" id="email" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <!-- Job Seeker Registration Document Processing Slot -->
      <div class="form-group reg-only seeker-only hidden">
        <label>Upload Resume (PDF, DOCX)</label>
        <label class="file-input-wrapper">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
          <span id="fileInputLabel">Click to browse documents</span>
          <input type="file" id="resumeFile" style="display:none;" accept=".pdf,.doc,.docx">
        </label>
      </div>

      <!-- Form Submission Trigger Action Button -->
      <button type="submit" class="btn-submit" id="submitBtn">Sign In to Dashboard</button>
    </form>
  </div>
</div>

<!-- INTERACTIVE DYNAMIC RENDER SCRIPTS -->
<script>
  let currentMode = 'login';
  let currentRole = 'seeker';

  function setAuthMode(mode) {
    currentMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    
    document.getElementById('formHeading').innerText = mode === 'login' ? 'Welcome Back' : 'Create Your Account';
    document.getElementById('formSubheading').innerText = mode === 'login' ? 'Access your curated dashboard workspace.' : 'Get started searching jobs or hiring top talent today.';
    document.getElementById('submitBtn').innerText = mode === 'login' ? 'Sign In to Dashboard' : 'Complete Registration';
    
    renderDynamicFields();
  }

  function setRole(role) {
    currentRole = role;
    document.getElementById('roleInput').value = role;
    document.getElementById('roleSeeker').classList.toggle('active', role === 'seeker');
    document.getElementById('roleEmployer').classList.toggle('active', role === 'employer');
    
    renderDynamicFields();
  }

  function renderDynamicFields() {
    const regFields = document.querySelectorAll('.reg-only');
    const seekerFields = document.querySelectorAll('.seeker-only');
    const employerFields = document.querySelectorAll('.employer-only');

    // Clean field state resets
    regFields.forEach(f => f.classList.add('hidden'));
    seekerFields.forEach(f => f.classList.add('hidden'));
    employerFields.forEach(f => f.classList.add('hidden'));

    if (currentMode === 'register') {
      regFields.forEach(f => {
        if (!f.classList.contains('seeker-only') && !f.classList.contains('employer-only')) {
          f.classList.remove('hidden');
        }
      });
      if (currentRole === 'seeker') seekerFields.forEach(f => f.classList.remove('hidden'));
      if (currentRole === 'employer') employerFields.forEach(f => f.classList.remove('hidden'));
    }
  }

  // File Input Selection Interactivity Feedback Handler
  document.getElementById('resumeFile').addEventListener('change', function(e) {
    const label = document.getElementById('fileInputLabel');
    if (this.files && this.files.length > 0) {
      label.innerText = 'Selected: ' + this.files[0].name;
      label.style.color = 'var(--blue)';
    } else {
      label.innerText = 'Click to browse documents';
      label.style.color = 'var(--gray)';
    }
  });
</script>
</body>
</html>
