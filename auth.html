<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join JobDelite – Secure Access</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b4b;
      --blue: #1a56ff;
      --blue-light: #3b82f6;
      --blue-pale: #eff4ff;
      --gray: #6b7280;
      --light: #f9fafb;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(26,86,255,0.10);
      --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; color: var(--navy); background: var(--light); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Nav alignment matching main file */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 5vw; background: var(--white); box-shadow: 0 1px 0 #e5e7eb;
    }
    .logo img { height: 40px; width: auto; }

    /* Auth Wrapper */
    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5vw; }
    .auth-card { background: var(--white); width: 100%; max-width: 480px; padding: 36px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e5e7eb; }
    
    /* Toggle Tabs */
    .auth-tabs { display: flex; border-bottom: 2px solid var(--blue-pale); margin-bottom: 24px; }
    .tab-btn { flex: 1; padding: 12px; font-family: inherit; font-size: 0.95rem; font-weight: 600; background: none; border: none; color: var(--gray); cursor: pointer; text-align: center; transition: all 0.2s; }
    .tab-btn.active { color: var(--blue); border-bottom: 2px solid var(--blue); margin-bottom: -2px; }

    /* Segmented Control for Roles */
    .role-selector { display: flex; background: var(--blue-pale); padding: 4px; border-radius: 8px; margin-bottom: 24px; }
    .role-btn { flex: 1; padding: 10px; font-family: inherit; font-size: 0.88rem; font-weight: 600; border: none; border-radius: 6px; background: transparent; color: var(--navy); cursor: pointer; transition: all 0.2s; text-align: center; }
    .role-btn.active { background: var(--white); color: var(--blue); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .form-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; text-align: center; }
    .form-subtitle { font-size: 0.88rem; color: var(--gray); text-align: center; margin-bottom: 24px; }

    /* Inputs Layout */
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--navy); }
    .form-group input, .form-group select { padding: 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 0.9rem; color: var(--navy); outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--blue); }
    
    .file-input-wrapper { border: 1.5px dashed #d1d5db; padding: 14px; border-radius: 8px; text-align: center; background: var(--light); cursor: pointer; font-size: 0.85rem; color: var(--gray); }

    .btn-submit { width: 100%; padding: 13px; border: none; border-radius: 8px; background: var(--blue); font-size: 0.95rem; font-weight: 700; color: var(--white); cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #1240d6; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<nav>
  <a href="#" class="logo"><img src="img/logoreal.png" alt="JobDelite Logo"/></a>
  <a href="index.html" style="text-decoration:none; font-size:0.88rem; font-weight:600; color:var(--blue)">← Back to Home</a>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <!-- Auth Mode Switcher -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="tabLogin" onclick="setAuthMode('login')">Sign In</button>
      <button class="tab-btn" id="tabRegister" onclick="setAuthMode('register')">Register</button>
    </div>

    <!-- Identity Role Switcher -->
    <div class="role-selector">
      <button class="role-btn active" id="roleSeeker" onclick="setRole('seeker')">Job Seeker</button>
      <button class="role-btn" id="roleEmployer" onclick="setRole('employer')">Employer / Company</button>
    </div>

    <h2 class="form-title" id="formHeading">Welcome Back</h2>
    <p class="form-subtitle" id="formSubheading">Access your curated dashboard workspace.</p>

    <form id="authForm" action="dashboard.html" method="GET">
      <!-- Universal Hidden query fields to simulate real state shifts on dashboard -->
      <input type="hidden" name="role" id="roleInput" value="seeker">
      
      <!-- Registration Fields (Hidden during Login) -->
      <div class="form-group reg-only hidden">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe">
      </div>

      <div class="form-group reg-only employer-only hidden">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" placeholder="e.g. Delite City Solutions">
      </div>

      <!-- General Account Credentials -->
      <div class="form-group">
        <label for="email">Work Email Address</label>
        <input type="email" id="email" placeholder="name@domain.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <!-- Job Seeker Registration Only -->
      <div class="form-group reg-only seeker-only hidden">
        <label>Upload Resume (PDF, DOCX)</label>
        <label class="file-input-wrapper">
          <span>Click to browse documents</span>
          <input type="file" style="display:none;">
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign In to Dashboard</button>
    </form>
  </div>
</div>

<script>
  let currentMode = 'login';
  let currentRole = 'seeker';

  function setAuthMode(mode) {
    currentMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    
    document.getElementById('formHeading').innerText = mode === 'login' ? 'Welcome Back' : 'Create Your Account';
    document.getElementById('formSubheading').innerText = mode === 'login' ? 'Access your curated dashboard workspace.' : 'Get started searching jobs or hiring top talent today.';
    document.getElementById('submitBtn').innerText = mode === 'login' ? 'Sign In to Dashboard' : 'Complete Registration';
    
    renderDynamicFields();
  }

  function setRole(role) {
    currentRole = role;
    document.getElementById('roleInput').value = role;
    document.getElementById('roleSeeker').classList.toggle('active', role === 'seeker');
    document.getElementById('roleEmployer').classList.toggle('active', role === 'employer');
    
    renderDynamicFields();
  }

  function renderDynamicFields() {
    const regFields = document.querySelectorAll('.reg-only');
    const seekerFields = document.querySelectorAll('.seeker-only');
    const employerFields = document.querySelectorAll('.employer-only');

    // Default cleanup
    regFields.forEach(f => f.classList.add('hidden'));
    seekerFields.forEach(f => f.classList.add('hidden'));
    employerFields.forEach(f => f.classList.add('hidden'));

    if (currentMode === 'register') {
      regFields.forEach(f => {
        if (!f.classList.contains('seeker-only') && !f.classList.contains('employer-only')) {
          f.classList.remove('hidden');
        }
      });
      if (currentRole === 'seeker') seekerFields.forEach(f => f.classList.remove('hidden'));
      if (currentRole === 'employer') employerFields.forEach(f => f.classList.remove('hidden'));
    }
  }
</script>
</body>
</html>
