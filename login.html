<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employer Sign In – JobDelite</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b4b;
      --blue: #1a56ff;
      --blue-pale: #eff4ff;
      --gray: #6b7280;
      --light: #f9fafb;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(26,86,255,0.10);
      --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; color: var(--navy); background: var(--light); min-height: 100vh; display: flex; flex-direction: column; }
    
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 5vw; background: var(--white); box-shadow: 0 1px 0 #e5e7eb;
      position: sticky; top: 0; z-index: 200;
    }
    .logo img { height: 40px; width: auto; }
    .back-home { text-decoration: none; font-size: 0.88rem; font-weight: 600; color: var(--blue); display: flex; align-items: center; gap: 4px; }

    .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5vw; }
    .auth-card { background: var(--white); width: 100%; max-width: 480px; padding: 36px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e5e7eb; }
    
    .form-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; text-align: center; letter-spacing: -0.3px; }
    .form-subtitle { font-size: 0.88rem; color: var(--gray); text-align: center; margin-bottom: 28px; }

    .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; position: relative; }
    .form-group input { padding: 14px 16px; border: 1.5px solid #d1d5db; border-radius: 10px; font-family: inherit; font-size: 0.95rem; color: var(--navy); outline: none; width: 100%; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26, 86, 255, 0.1); }
    
    .password-wrapper { position: relative; width: 100%; }
    .password-wrapper input { padding-right: 46px; }
    .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gray); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .password-toggle:hover { color: var(--navy); }

    .form-options { display: flex; align-items: center; justify-content: space-between; margin-top: -4px; margin-bottom: 24px; font-size: 0.9rem; }
    .remember-me { display: flex; align-items: center; gap: 8px; font-weight: 500; color: #374151; cursor: pointer; }
    .remember-me input { width: 18px; height: 18px; accent-color: var(--blue); cursor: pointer; }
    .forgot-password { color: var(--blue); text-decoration: none; font-weight: 600; }
    .forgot-password:hover { text-decoration: underline; }

    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--blue); font-size: 1rem; font-weight: 700; color: var(--white); cursor: pointer; transition: background 0.2s; font-family: inherit; }
    .btn-submit:hover { background: #1240d6; }

    .auth-footer { text-align: center; margin-top: 24px; font-size: 0.95rem; font-weight: 500; color: #374151; }
    .auth-footer a { color: var(--blue); text-decoration: none; font-weight: 700; margin-left: 4px; }
    .auth-footer a:hover { text-decoration: underline; }
    
    .divider { height: 1px; background: #e5e7eb; margin: 20px 0; }
    .badge { display: inline-block; background: var(--blue-pale); color: var(--blue); font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
    .badge-container { text-align: center; }

    @media (max-width: 480px) {
      .auth-card { padding: 24px 16px; }
      .form-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo"><img src="img/logoreal.png" alt="JobDelite Logo"/></a>
  <a href="index.html" class="back-home">← Back to Home</a>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <div class="badge-container">
      <span class="badge">Job Seeker Portal</span>
    </div>
    <h2 class="form-title">Welcome Back</h2>
    <p class="form-subtitle">Enter your credentials to access your secure portal dashboard.</p>

    <form id="employerLoginForm" action="dashboard.html" method="GET">
      <!-- Implicit hidden value telling backend to parse corporate authentication schemas -->
      <input type="hidden" name="role" value="employer">
      
      <div class="form-group">
        <input type="email" id="email" name="email" placeholder="Work Email Address" required>
      </div>

      <div class="form-group">
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Password" required>
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle Password Visibility">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="eyeIcon">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <div style="visibility: hidden;"></div>
        <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>
      </div>
      
      <div class="divider"></div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember"> Keep me logged in
        </label>
      </div>

      <button type="submit" class="btn-submit">Log in to Workspace</button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a href="register-seeker.html">Sign up</a>
      <br>
      <span style="font-size: 0.82rem; font-weight: 500; color: var(--gray);">
        Register Corporate Agency <a href="register-employer.html" style="font-size: 0.82rem; font-weight: 600;">Register Corporate Agency</a>
      </span>
    </div>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.innerHTML = `
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      `;
    } else {
      passwordInput.type = 'password';
      eyeIcon.innerHTML = `
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      `;
    }
  }
</script>
</body>
</html>
